services:
  pipeline:
    build: .
    container_name: mekong_da_pipeline
    env_file:
      - .env
    environment:
      DWH_URL: ${DWH_URL:-sqlite:///data/mekong_dw.db}
      DATA_DIR: ${DATA_DIR:-dataset}
      PSEUDO_KEY: ${PSEUDO_KEY:?PSEUDO_KEY must be set in .env}
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - dwh_data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  dwh_data: